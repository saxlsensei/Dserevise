<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HKDSE 溫習測驗</title>
  <link rel="stylesheet" href="css/aero.css">
</head>
<body>
  <div id="wallpaper" aria-hidden="true"></div>

  <main id="desktop">
    <section class="welcome">
      <h1>HKDSE 溫習測驗</h1>
      <p>點擊左下角「開始」，選擇科目與範文即可開始溫習。</p>
    </section>
  </main>

  <!-- 開始選單 -->
  <section id="start-menu" class="hidden" role="dialog" aria-label="開始選單">
    <header class="sm-user">
      <img src="icons/avatar.svg" alt="" width="44" height="44">
      <div>
        <strong>考生</strong>
        <small>HKDSE 溫習中心</small>
      </div>
    </header>

    <div class="sm-body">
      <div class="sm-left">
        <div class="sm-title" id="sm-title">所有科目</div>
        <div id="sm-list"></div>
      </div>
      <nav class="sm-right" aria-label="其他功能">
        <button class="sm-link" data-go="review">錯題檢討 <span id="wrong-badge" class="badge hidden">0</span></button>
        <button class="sm-link" data-go="records">學習紀錄</button>
        <button class="sm-link" data-go="help">使用說明</button>
      </nav>
    </div>

    <footer class="sm-foot">
      <label class="sm-search">
        <img src="icons/search.svg" alt="" width="18" height="18">
        <input id="sm-search" type="search" placeholder="搜尋科目或測驗" autocomplete="off">
      </label>
      <button class="btn small" id="btn-desktop">返回桌面</button>
    </footer>
  </section>

  <!-- 工作列 -->
  <nav id="taskbar" aria-label="工作列">
    <button id="start-orb" aria-label="開始" aria-expanded="false" aria-controls="start-menu">
      <img src="icons/orb.svg" alt="" width="52" height="52">
    </button>
    <div id="task-items"></div>
    <div id="clock" aria-live="off"></div>
  </nav>

  <div id="toast" role="status" aria-live="polite"></div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
